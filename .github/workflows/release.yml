name: Publish SWF Cheat Menu v2.2.0
on:
  push:
    branches: [main]
    paths:
      - 'SWF_CheatMenu.js'
      - 'Setup.py'
      - 'Install_*'
      - 'Remove_*'
      - 'scripts/build_release.py'
      - 'tests/**'
      - 'README.md'
      - 'Setup_Windows.ps1'
      - 'tests/test_posix_installers.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX scripts
        run: bash -n Install_Linux.sh Remove_Linux.sh Install_macOS.command Remove_macOS.command
      - name: Test Linux and macOS installer CLI
        run: python3 -m unittest discover -s tests -v
  macos-validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX scripts on macOS
        run: bash -n Install_macOS.command Remove_macOS.command Install_Linux.sh Remove_Linux.sh
      - name: Test installer CLI and simulated macOS selection
        run: python3 -m unittest discover -s tests -v
  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Setup_Windows.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - name: Test installer logic on Windows
        run: python -m unittest discover -s tests -v
  publish:
    needs: [windows-validation, linux-validation, macos-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify plugin and installer
        run: |
          node --check SWF_CheatMenu.js
          python3 -m py_compile Setup.py
          python3 -m unittest discover -s tests -v
      - name: Package
        run: python3 scripts/build_release.py
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(cat <<'EOF'
          **SWF Cheat Menu v2.2.0** — RPG Maker MV/MZ, Windows, macOS and Linux.

          - Plugin file: `SWF_CheatMenu.js` (avoids Xenolauncher's built-in `Cheat_Menu.js` filename).
          - Controls: `1` for quick overlay, `F7` or the in-game **Control Menu** key item for the full menu, including battle functions.
          - Includes automatic installers (Python 3 required) and migration for recognized previous integrated-menu installations; modified files are backed up.
          - In Xenolauncher, leave its own **Enable Cheat Menu** option disabled.
          - Source acknowledgements and redistribution caveats: [CREDITS.md](https://github.com/SomeWellForever/RPG-Maker-MV-MZ-Integrated-Cheat-Menu/blob/main/CREDITS.md).

          **SWF Cheat Menu 2.2.0** — объединённое чит-меню для RPG Maker MV/MZ. Windows, macOS и Linux. Установщики переносят распознаваемые старые подключения и сохраняют резервные копии. Встроенное Cheat Menu в Xenolauncher должно быть выключено.
          EOF
          )"
          if gh release view v2.2.0 >/dev/null 2>&1; then
            gh release edit v2.2.0 --title "SWF Cheat Menu v2.2.0" --notes "$NOTES"
            gh release upload v2.2.0 SWF_CheatMenu_MV_MZ_v2.2.0.zip --clobber
          else
            gh release create v2.2.0 SWF_CheatMenu_MV_MZ_v2.2.0.zip --title "SWF Cheat Menu v2.2.0" --notes "$NOTES"
          fi
