name: Verify and publish trilingual native installers (Windows and Linux)
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version consistency
        run: python3 scripts/check_version.py
      - name: Verify README, help texts, release notes and install instructions
        run: python3 scripts/check_docs.py
      - name: Check plugin JavaScript syntax
        run: node --check SWF_CheatMenu.js
      - name: Check Russian, English and Spanish translations in both menus
        run: node tests/test_i18n.cjs
      - name: Check duplicate-load quick-menu hotkeys
        run: node tests/test_single_load.cjs
      - name: Check F7 during active map choices and mini-games
        run: node tests/test_map_minigame.cjs
      - name: Check variable values and switch-state search
        run: node tests/test_value_search.cjs
      - name: Check owned ordinary items refill
        run: node tests/test_refill_items.cjs
      - name: Test saved quick-menu teleport slots after map changes
        run: node tests/test_quick_teleport.cjs
      - name: Check custom note-defined inventory caps
        run: node tests/test_inventory_cap.cjs
      - name: Check live search and scrollbar behavior
        run: node tests/test_search_scroll.cjs
      - name: Check favorites, sorting and six-tile grid
        run: node tests/test_favorites_grid.cjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: Test native installation engine
        run: go -C installer test -v ./...
      - name: Build Windows executable
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory -Path bin | Out-Null
          go -C installer build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-windows-amd64.exe .
      - name: Install and remove using Windows wrapper
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Setup_Windows.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $game = Join-Path $env:RUNNER_TEMP 'RPG Maker [test] 日本語'
          $js = Join-Path $game 'www\js'
          New-Item -Force -ItemType Directory -Path (Join-Path $js 'plugins') | Out-Null
          Set-Content -LiteralPath (Join-Path $js 'main.js') -Value 'PluginManager.setup($plugins);' -Encoding utf8
          Set-Content -LiteralPath (Join-Path $js 'plugins.js') -Value 'var $plugins = [{"name":"Other","status":true}];' -Encoding utf8
          & .\Setup_Windows.ps1 -Action install -GamePath $game
          if ($LASTEXITCODE -ne 0) { throw 'Fresh install failed' }
          & .\Setup_Windows.ps1 -Action install -GamePath $game
          if ($LASTEXITCODE -ne 0) { throw 'Repeat install failed' }
          $plugin = Get-Content -Raw -LiteralPath (Join-Path $js 'plugins\SWF_CheatMenu.js')
          if ($plugin -notmatch 'SWF_EN_STRINGS') { throw 'Installed plugin lacks language selection' }
          $registered = Get-Content -Raw -LiteralPath (Join-Path $js 'plugins.js')
          if ($registered -notmatch '"SWF_CheatMenu"') { throw 'Plugin was not registered' }
          & .\Setup_Windows.ps1 -Action remove -GamePath $game
          if ($LASTEXITCODE -ne 0) { throw 'Remove failed' }
          $registered = Get-Content -Raw -LiteralPath (Join-Path $js 'plugins.js')
          if ($registered -match '"SWF_CheatMenu"') { throw 'Plugin was not removed' }

      - name: Install automatically when ZIP is extracted into Windows game folder
        shell: pwsh
        run: |
          $game = Join-Path $env:RUNNER_TEMP 'Auto-install RPG Maker MZ 日本語'
          $js = Join-Path $game 'js'
          New-Item -Force -ItemType Directory -Path (Join-Path $js 'plugins') | Out-Null
          New-Item -Force -ItemType Directory -Path (Join-Path $game 'bin') | Out-Null
          Set-Content -LiteralPath (Join-Path $js 'main.js') -Value 'PluginManager.setup($plugins);' -Encoding utf8
          Set-Content -LiteralPath (Join-Path $js 'plugins.js') -Value 'var $plugins = []; ' -Encoding utf8
          Copy-Item -LiteralPath 'Setup_Windows.ps1' -Destination (Join-Path $game 'Setup_Windows.ps1')
          Copy-Item -LiteralPath 'SWF_CheatMenu.js' -Destination (Join-Path $game 'SWF_CheatMenu.js')
          Copy-Item -LiteralPath 'bin/swf-setup-windows-amd64.exe' -Destination (Join-Path $game 'bin/swf-setup-windows-amd64.exe')
          & (Join-Path $game 'Setup_Windows.ps1') -Action install
          if ($LASTEXITCODE -ne 0) { throw 'In-place installation failed' }
          $registry = Get-Content -Raw -LiteralPath (Join-Path $js 'plugins.js')
          if ($registry -notmatch '"SWF_CheatMenu"') { throw 'Auto-detected game was not registered' }
          if (-not (Test-Path -LiteralPath (Join-Path $js 'plugins/SWF_CheatMenu.js'))) { throw 'Plugin payload missing' }
          & (Join-Path $game 'Setup_Windows.ps1') -Action remove
          if ($LASTEXITCODE -ne 0) { throw 'In-place removal failed' }
          $registry = Get-Content -Raw -LiteralPath (Join-Path $js 'plugins.js')
          if ($registry -match '"SWF_CheatMenu"') { throw 'In-place removal left registry entry' }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: Test native installation engine
        run: go -C installer test -v ./...
      - name: Build Linux executable and check wrappers
        run: |
          mkdir -p bin
          go -C installer build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-linux-amd64 .
          bash -n Install_Linux.sh Remove_Linux.sh
          GAME="$RUNNER_TEMP/Game with spaces 日本語"
          mkdir -p "$GAME/www/js/plugins"
          printf 'PluginManager.setup($plugins);\n' > "$GAME/www/js/main.js"
          printf 'var $plugins = [{"name":"Other","status":true}];\n' > "$GAME/www/js/plugins.js"
          bash Install_Linux.sh "$GAME"
          bash Install_Linux.sh "$GAME"
          grep -q '"SWF_CheatMenu"' "$GAME/www/js/plugins.js"
          grep -q SWF_EN_STRINGS "$GAME/www/js/plugins/SWF_CheatMenu.js"
          bash Remove_Linux.sh "$GAME"
          ! grep -q '"SWF_CheatMenu"' "$GAME/www/js/plugins.js"

      - name: Install automatically when ZIP is extracted into Linux game folder
        run: |
          GAME="$RUNNER_TEMP/Auto-install RPG Maker MZ 日本語"
          mkdir -p "$GAME/js/plugins" "$GAME/bin"
          printf 'PluginManager.setup($plugins);\n' > "$GAME/js/main.js"
          printf 'var $plugins = [];\n' > "$GAME/js/plugins.js"
          cp Install_Linux.sh Remove_Linux.sh SWF_CheatMenu.js "$GAME/"
          cp bin/swf-setup-linux-amd64 "$GAME/bin/"
          bash "$GAME/Install_Linux.sh"
          grep -q '"SWF_CheatMenu"' "$GAME/js/plugins.js"
          test -f "$GAME/js/plugins/SWF_CheatMenu.js"
          bash "$GAME/Remove_Linux.sh"
          ! grep -q '"SWF_CheatMenu"' "$GAME/js/plugins.js"

  package:
    needs: [plugin, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: Build native installers for Windows and Linux
        run: |
          mkdir -p bin
          (cd installer && GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-windows-amd64.exe .)
          (cd installer && GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-windows-arm64.exe .)
          (cd installer && GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-linux-amd64 .)
          (cd installer && GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-linux-arm64 .)
      - name: Create and verify release ZIP
        run: |
          chmod +x bin/swf-setup-linux-*
          python3 scripts/build_release.py
          python3 scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: SWF-CheatMenu-v2.8.0-Windows-Linux
          path: |
            SWF_CheatMenu_MV_MZ_v2.8.0.zip
            SWF_CheatMenu_plugin_only_v2.8.0.zip
          if-no-files-found: error
      - name: Validate current release versions
        run: python3 scripts/check_version.py
      # A branch update only runs CI. Existing releases and historical tags are immutable.
      - name: Publish a new release only from its matching version tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^ver = "[0-9]+[.][0-9]+[.][0-9]+"' scripts/check_version.py | cut -d '"' -f 2)"
          RELEASE_TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Refusing to release: tag $GITHUB_REF_NAME does not match code version $RELEASE_TAG." >&2
            exit 1
          fi
          # Publishing a new version from main is allowed once. Existing releases
          # are immutable and ordinary documentation commits cannot republish them.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it untouched."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG exists without a GitHub Release; refusing to overwrite it." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## SWF Cheat Menu v2.8.0

          **RPG Maker MV/MZ · Windows and Linux installers**

          - **Main menu:** six large native tiles arranged in a two-column grid, regrouping existing features without removing them.
          - **Category sorting:** group game items, weapons, armor and skills by native database type with visible section headers; keep ID, name and favorites sorting.
          - **Favorites:** stars in catalogs and a dedicated Favorites main-menu section (per save).
          - **Two ZIP options:** full Windows/Linux installer package and plugin-only JavaScript update for an already patched game.
          - **Ten fast-travel points:** ten shared positions across the full menu and paginated quick overlay. Existing three-slot saves are retained; 0/minus browse groups while other hotkeys stay unchanged.
          - **Inventory compatibility:** explicitly selected 99/999/9999 can override note-defined `itemMaxNum` caps on ordinary stackable items, while preserving unique/no-stack/key-item restrictions. Default respects game limits.
          - **Switch state search:** filter named switches with `ON` / `OFF` or `=true` / `=false`, including explicit `=1` / `=0`.
          - **Map mini-game fix:** F7 still opens inside the active map scene, pausing scripted events without reconstructing message/choice windows on return.
          - **Languages:** Auto / Русский / English / Español applies to both the full control menu (`F7`) and legacy quick overlay (`1`), including when switching while it is open. In-game names are unchanged.
          - **Fix:** when upgrading, automatically disable an active legacy `Cheat_Menu` with an empty description; preserve its options and all other plugins.
          - **Fix:** loading the integrated script twice no longer registers two quick-menu hotkey handlers.
          - **No Python or Go required.** Native Windows and Linux installers, backups and removal.

          **Installation:** Close the game, extract the ZIP **directly into the game folder**, then run `Install_Windows.cmd` or `bash Install_Linux.sh`. The installer detects the game automatically. If extracted elsewhere, run the installer and select the game folder. Back up your saves before using the mod.

          **Mac / Xenolauncher:** You can copy an already-patched game from Windows/Linux to a Mac and try launching it through [Xenolauncher](https://github.com/m5kro/Xenolauncher), a third-party macOS game launcher. Disable its `Enable Cheat Menu` option to avoid conflicts. Game compatibility varies.

          ---
          ## SWF Cheat Menu v2.8.0 — русский

          **RPG Maker MV/MZ · установщики Windows и Linux**

          - **Главное меню:** шесть крупных плиток в два столбца с понятными категориями вместо одного длинного списка.
          - **Сортировка по категориям:** группировка предметов, оружия, брони и навыков по типам из базы игры с разделительными заголовками.
          - **Избранное:** звёздочки в каталогах и отдельная вкладка; остальные режимы сортировки по ID, названию или избранному сохранены.
          - **Два архива:** обычный установщик для Windows/Linux и отдельный JavaScript-плагин для обновления уже установленной игры.
          - **Десять точек перемещения:** десять общих слотов в основном и быстром меню. Старые три точки не теряются, 0/минус перелистывают группы, остальные клавиши не меняются.
          - **Совместимость инвентаря:** выбранные 99/999/9999 теперь перекрывают ограничения `itemMaxNum` обычных складываемых предметов. Уникальные и нестекаемые предметы, ключевые предметы защищены, стандартный лимит игры сохраняется.
          - **Мини-игры:** F7 по-прежнему открывает меню поверх текущей карты, не пересоздавая окна выбора.
          - **Языки:** Auto / Русский / English / Español теперь одновременно переключают основное меню (`F7`) и быстрый оверлей (`1`); текст меняется даже при открытом быстром меню. Имена из игры не переводятся.
          - **Исправлено:** установка отключает старый `Cheat_Menu` с пустым описанием и сохраняет его настройки и другие плагины.
          - **Исправлено:** повторная загрузка скрипта не добавляет второй обработчик клавиши `1`.
          - **Python и Go не нужны.** Автономные установщики, резервные копии и удаление.

          **Установка:** Закройте игру, распакуйте ZIP **прямо в папку игры**, затем запустите `Install_Windows.cmd` или `bash Install_Linux.sh`. Установщик автоматически найдёт игру. Если архив распакован в другом месте, выберите папку игры при запуске. Перед использованием сделайте резервную копию сохранений.

          **Mac / Xenolauncher:** Уже пропатченную на Windows/Linux игру можно перенести на Mac и попробовать запустить через [Xenolauncher](https://github.com/m5kro/Xenolauncher) — сторонний лаунчер для macOS. Отключите в нём `Enable Cheat Menu`, чтобы избежать конфликта. Совместимость зависит от игры.
          EOF
          gh release create "$RELEASE_TAG" "SWF_CheatMenu_MV_MZ_v${VERSION}.zip" "SWF_CheatMenu_plugin_only_v${VERSION}.zip" --target "$GITHUB_SHA" --title "SWF Cheat Menu $RELEASE_TAG" --notes-file release-notes.md --latest
