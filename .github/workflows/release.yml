name: Verify and publish bilingual native installers (Windows and Linux)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version consistency
        run: python3 scripts/check_version.py
      - name: Verify README, help texts, release notes and install instructions
        run: python3 scripts/check_docs.py
      - name: Check plugin JavaScript syntax
        run: node --check SWF_CheatMenu.js
      - name: Check language switching, Russian and English translations
        run: node tests/test_i18n.cjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: Test native installation engine
        run: go -C installer test -v ./...
      - name: Build Windows executable
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory -Path bin | Out-Null
          go -C installer build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-windows-amd64.exe .
      - name: Install and remove using Windows wrapper
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Setup_Windows.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $game = Join-Path $env:RUNNER_TEMP 'RPG Maker [test] 日本語'
          $js = Join-Path $game 'www\js'
          New-Item -Force -ItemType Directory -Path (Join-Path $js 'plugins') | Out-Null
          Set-Content -LiteralPath (Join-Path $js 'main.js') -Value 'PluginManager.setup($plugins);' -Encoding utf8
          Set-Content -LiteralPath (Join-Path $js 'plugins.js') -Value 'var $plugins = [{"name":"Other","status":true}];' -Encoding utf8
          & .\Setup_Windows.ps1 -Action install -GamePath $game
          if ($LASTEXITCODE -ne 0) { throw 'Fresh install failed' }
          & .\Setup_Windows.ps1 -Action install -GamePath $game
          if ($LASTEXITCODE -ne 0) { throw 'Repeat install failed' }
          $plugin = Get-Content -Raw -LiteralPath (Join-Path $js 'plugins\SWF_CheatMenu.js')
          if ($plugin -notmatch 'SWF_EN_STRINGS') { throw 'Installed plugin lacks language selection' }
          $registered = Get-Content -Raw -LiteralPath (Join-Path $js 'plugins.js')
          if ($registered -notmatch '"SWF_CheatMenu"') { throw 'Plugin was not registered' }
          & .\Setup_Windows.ps1 -Action remove -GamePath $game
          if ($LASTEXITCODE -ne 0) { throw 'Remove failed' }
          $registered = Get-Content -Raw -LiteralPath (Join-Path $js 'plugins.js')
          if ($registered -match '"SWF_CheatMenu"') { throw 'Plugin was not removed' }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: Test native installation engine
        run: go -C installer test -v ./...
      - name: Build Linux executable and check wrappers
        run: |
          mkdir -p bin
          go -C installer build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-linux-amd64 .
          bash -n Install_Linux.sh Remove_Linux.sh
          GAME="$RUNNER_TEMP/Game with spaces 日本語"
          mkdir -p "$GAME/www/js/plugins"
          printf 'PluginManager.setup($plugins);\n' > "$GAME/www/js/main.js"
          printf 'var $plugins = [{"name":"Other","status":true}];\n' > "$GAME/www/js/plugins.js"
          bash Install_Linux.sh "$GAME"
          bash Install_Linux.sh "$GAME"
          grep -q '"SWF_CheatMenu"' "$GAME/www/js/plugins.js"
          grep -q SWF_EN_STRINGS "$GAME/www/js/plugins/SWF_CheatMenu.js"
          bash Remove_Linux.sh "$GAME"
          ! grep -q '"SWF_CheatMenu"' "$GAME/www/js/plugins.js"

  package:
    needs: [plugin, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: Build native installers for Windows and Linux
        run: |
          mkdir -p bin
          (cd installer && GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-windows-amd64.exe .)
          (cd installer && GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-windows-arm64.exe .)
          (cd installer && GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-linux-amd64 .)
          (cd installer && GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../bin/swf-setup-linux-arm64 .)
      - name: Create and verify release ZIP
        run: |
          chmod +x bin/swf-setup-linux-*
          python3 scripts/build_release.py
          python3 scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: SWF-CheatMenu-v2.3.0-Windows-Linux
          path: SWF_CheatMenu_MV_MZ_v2.3.0.zip
          if-no-files-found: error
      - name: Validate current release versions
        run: python3 scripts/check_version.py
      - name: Publish GitHub release v2.3.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## SWF Cheat Menu v2.3.0

          **Platforms:** Windows and Linux (RPG Maker MV/MZ). macOS is not supported in this release.

          ### What's new
          - **English and Russian interface:** integrated control menu supports Auto / Русский / English with a saved preference. The legacy quick overlay remains in English; names of items, maps and skills come from the game.
          - **No Python required:** native Windows and Linux installers. End users do not need Python or Go installed.
          - **Reliable upgrades:** supported updates from recognized older Integrated Cheat Menu versions, repeated installation without duplicate plugin registrations, automatic backups, and safe removal.
          - The macOS installer was withdrawn following launch/permissions issues.
          - **Optional compatibility:** [Xenolauncher](https://github.com/m5kro/Xenolauncher) is a separate macOS game launcher. Only if you already use it, disable its **Enable Cheat Menu** option to avoid conflicts. Xenolauncher is not required for this mod, and macOS is not supported by this release.
          - Upstream authors and redistribution notes: CREDITS.md.

          ### How to install
          Extract the **entire ZIP**, keeping the bin folder beside the installers. On Windows run Install_Windows.cmd; on Linux run bash Install_Linux.sh. Select the **game root** (containing www/js for MV or js for MZ), not the js directory itself. Back up your saves first.

          ---
          ## SWF Cheat Menu v2.3.0 — русский

          **Платформы:** Windows и Linux. Поддержка macOS прекращена из-за проблем с запуском установщика.

          - **Русский и английский:** переключатель Auto / Русский / English внутри меню F7; выбор сохраняется. Быстрое меню на 1 осталось английским, а названия предметов/карт/навыков берутся из игры.
          - **Python не нужен:** готовые установщики Windows и Linux; Go устанавливать тоже не требуется.
          - **Обновление поверх старых версий:** миграция распознаваемых предыдущих установок, резервные копии, повторная установка без дублирования и удаление.
          - **Только для пользователей Xenolauncher:** это отдельный сторонний лаунчер для macOS. Если вы уже им пользуетесь, отключите его **Enable Cheat Menu**, чтобы два чит-меню не конфликтовали. Устанавливать Xenolauncher не нужно; macOS в этом релизе не поддерживается.

          Полностью распакуйте ZIP, оставив папку bin рядом с установщиками. В Windows запустите Install_Windows.cmd; в Linux — bash Install_Linux.sh. Выберите корневую папку игры (MV: www/js, MZ: js), а не папку js. Предварительно сохраните резервную копию игровых сохранений.
          EOF
          if gh release view v2.3.0 >/dev/null 2>&1; then
            gh release edit v2.3.0 --title "SWF Cheat Menu v2.3.0" --notes-file release-notes.md --latest
            gh release upload v2.3.0 SWF_CheatMenu_MV_MZ_v2.3.0.zip --clobber
          else
            gh release create v2.3.0 SWF_CheatMenu_MV_MZ_v2.3.0.zip --target "$GITHUB_SHA" --title "SWF Cheat Menu v2.3.0" --notes-file release-notes.md --latest
          fi
      - name: Restore historical v2.2.0 release and source tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS_COMMIT=dd0a3ccc2e2baa9b2382109f4f001e46100a0cf0
          CURRENT_TAG="$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v2.2.0 --jq '.object.sha')"
          if [ "$CURRENT_TAG" = "$PREVIOUS_COMMIT" ]; then
            echo "Historical v2.2.0 release already restored"
            exit 0
          fi
          git fetch --depth=1 origin "$PREVIOUS_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/swf-legacy-v2.2" "$PREVIOUS_COMMIT"
          python3 "$RUNNER_TEMP/swf-legacy-v2.2/scripts/build_release.py"
          cat > historical-release-notes.md <<'EOF'
          ## SWF Cheat Menu v2.2.0 — historical release
          
          Archived original v2.2.0 build from before native installers and bilingual interface. Earlier ZIP bundled Python-based installers. macOS appeared in this historical build but is **not supported** in the current v2.3.0 release.
          
          For Windows/Linux, **use v2.3.0** for the latest fixes, English/Russian interface and standalone installers.
          
          ---
          ## SWF Cheat Menu v2.2.0 — предыдущая версия
          
          Восстановлена исходная сборка v2.2.0: установщики на Python, без двуязычного меню. macOS присутствовала в старом архиве, но в актуальной v2.3.0 эта платформа **не поддерживается**.
          
          **Рекомендуется версия v2.3.0** для Windows и Linux.
          EOF
          gh release upload v2.2.0 "$RUNNER_TEMP/swf-legacy-v2.2/SWF_CheatMenu_MV_MZ_v2.2.0.zip" --clobber
          gh release edit v2.2.0 --notes-file historical-release-notes.md --latest=false
          git tag -f v2.2.0 "$PREVIOUS_COMMIT"
          git push --force origin refs/tags/v2.2.0
      - name: Align current v2.3.0 source tag with published revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f v2.3.0 "$GITHUB_SHA"
          git push --force origin refs/tags/v2.3.0
