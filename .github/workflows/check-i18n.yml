name: Check bilingual RPG Maker plugin
on:
  pull_request:
    branches: [main]
    paths:
      - 'SWF_CheatMenu.js'
      - 'tests/test_i18n.cjs'
      - '.github/workflows/check-i18n.yml'
  workflow_dispatch:
jobs:
  bilingual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check SWF_CheatMenu.js
      - name: Verify Russian and English strings, auto mode and saved selection
        run: node tests/test_i18n.cjs
      - name: Export bilingual plugin for test archive
        uses: actions/upload-artifact@v4
        with:
          name: SWF-CheatMenu-bilingual-plugin
          path: SWF_CheatMenu.js
          if-no-files-found: error
