name: Bug report / Ошибка
description: Report a problem / Сообщить об ошибке
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Please include steps to reproduce. / Опишите, как повторить ошибку."
  - type: input
    id: game
    attributes:
      label: Game and version / Игра и версия
      placeholder: "Game Name 2.07"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system / Операционная система
      options:
        - Windows
        - Linux
        - Other / Другая
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine / Движок
      options:
        - RPG Maker MV
        - RPG Maker MZ
        - Unsure / Не знаю
    validations:
      required: true
  - type: input
    id: mod
    attributes:
      label: Mod version / Версия мода
      placeholder: v2.8.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and result / Действия и результат
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error / Ошибка
      description: Paste the message or add a screenshot. / Текст ошибки или скриншот.
  - type: textarea
    id: plugins
    attributes:
      label: Other plugins / Другие плагины
